name: Build and optionally deploy Rust admin backend

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'rust-backend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'rust-backend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test --manifest-path rust-backend/Cargo.toml

      - name: Build Rust release binary
        run: cargo build --release --manifest-path rust-backend/Cargo.toml

      - name: Build deployment image
        run: docker build .

      - name: Trigger deployment webhook
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.DEPLOY_WEBHOOK_URL != ''
        run: curl -fsSL -X POST "$DEPLOY_WEBHOOK_URL"
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
