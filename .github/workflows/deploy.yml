name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: npm install
        working-directory: cloudflare-worker

      # Apply any pending D1 migrations before deploying the new Worker code.
      # This ensures the schema is up-to-date before the Worker starts handling requests.
      # If you have not yet created the D1 database, run once locally:
      #   cd cloudflare-worker && npx wrangler d1 create tradingbot
      # Then commit the updated database_id in wrangler.toml.
      - name: Apply D1 Migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          workingDirectory: 'cloudflare-worker'
          command: d1 migrations apply tradingbot --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          workingDirectory: 'cloudflare-worker'
