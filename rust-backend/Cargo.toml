[package]
name = "wlt-trading-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
bs58 = "0.5"
bincode = "1.3"
dotenv = "0.15"
env_logger = "0.11"
hex = "0.4"
log = "0.4"
rand = "0.8"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
solana-sdk = "=1.18.26"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
warp = "0.3"
