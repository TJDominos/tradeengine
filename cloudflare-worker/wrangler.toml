name = "tradeengine"
main = "src/index.ts"
compatibility_date = "2024-04-05"
node_compat = true

# Secrets (configured via `wrangler secret put <NAME>`)
# - BOT_SECRET_KEY

[vars]
RPC_URL = "https://api.mainnet-beta.solana.com"
MY_VAR = "my-value"

# Bind a D1 Database for relational production data
[[d1_databases]]
binding = "DB"
database_name = "trading_engine_db"
database_id = "b93f4c50-a519-422c-9b31-15244ef3184f"
migrations_dir = "./migrations"

# KV Namespace binding
[[kv_namespaces]]
binding = "MY_KV"
id = "your-kv-namespace-id"

# R2 Bucket binding
[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "my-bucket"

# Queue binding
[[queues.producers]]
binding = "MY_QUEUE"
queue = "my-queue"

