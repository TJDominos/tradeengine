name = "tradeengine"
main = "src/index.ts"
compatibility_date = "2024-04-05"
node_compat = true

# Secrets (set via `wrangler secret put <NAME>` from inside cloudflare-worker/)
# - BOT_SECRET_KEY
# - PVK3
# - FRONTEND

[vars]
RPC_URL = "https://api.mainnet-beta.solana.com"

# Bind a D1 Database for relational production data
# Deploy from cloudflare-worker/ with: wrangler deploy
# Apply schema with: wrangler d1 execute trading_engine_db --remote --file=schema.sql
[[d1_databases]]
binding = "TRADINGBOT_DB"
database_name = "tradingbot"
database_id = "b93f4c50-a519-422c-9b31-15244ef3184f"
