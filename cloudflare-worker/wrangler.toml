name = "wlt-trading-worker"
main = "src/index.ts"
compatibility_date = "2024-04-05"
node_compat = true

# Secrets (configured via `wrangler secret put <NAME>`)
# - BOT_SECRET_KEY

[vars]
RPC_URL = "https://api.mainnet-beta.solana.com"

# Bind a KV Namespace to persist account tags, addresses, and transaction logs
# Create one via: npx wrangler kv:namespace create "TRADING_KV"
# [[kv_namespaces]]
# binding = "TRADING_KV"
# id = "<YOUR_NAMESPACE_ID>"
