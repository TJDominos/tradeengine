name = "wlt-trading-worker"
main = "src/index.ts"
compatibility_date = "2024-04-05"
node_compat = true

# Secrets (configured via `wrangler secret put <NAME>`)
# - BOT_SECRET_KEY

[vars]
RPC_URL = "https://api.mainnet-beta.solana.com"

# Bind a D1 Database for relational production data
[[d1_databases]]
binding = "DB"
database_name = "trading_engine_db"
database_id = "local-dev-id" # For local development
migrations_dir = "./migrations"

