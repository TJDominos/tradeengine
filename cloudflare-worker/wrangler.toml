name = "tradeengine"
main = "src/index.ts"
compatibility_date = "2024-04-05"
node_compat = true

[vars]
# Public / non-secret configuration.
# Secret values (FRONTEND_TOKEN, BOT_SECRET_KEY) must be set via:
#   wrangler secret put FRONTEND_TOKEN
#   wrangler secret put BOT_SECRET_KEY
RPC_URL = "https://api.mainnet-beta.solana.com"

[[d1_databases]]
binding      = "TRADINGBOT_DB"
database_name = "tradingbot"
database_id  = "b93f4c50-a519-422c-9b31-15244ef3184f"
migrations_dir = "migrations"
